[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/ag-ra-ai/ferris-wheel"

# Shared dependency versions live here; member crates use `dep.workspace = true`.
[workspace.dependencies]
wgpu = "30.0.2"
winit = "0.30.13"
pollster = "1.0.3"
log = "0.4.35"
env_logger = "0.11.12"
png = "0.18.1"
web-time = "1.1.0"
# Web only. wasm-bindgen and wasm-bindgen-cli-support (used by xtask) must be
# the exact same version, so both are pinned with `=`.
wasm-bindgen = "=0.2.130"
wasm-bindgen-cli-support = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dependencies (e.g. wgpu) are slow in debug; optimize them, keep our code fast to compile.
[profile.dev.package."*"]
opt-level = 2
